next_round: >
  Round 22 — se alguma das 3 combinações melhorar, promover o novo campeão e registrar os
  eventos tratados em protocolo metodológico §11 (tabela de spikes). Se ISAE4×resultado_bruto regredir
  (padrão do Round 08 com ALUP4), reverter o tratamento apenas para essa combinação e documentar
  como tratamento nulo/negativo. Se nenhuma combinação melhorar, fechar formalmente a frente de
  ajuste de dados via outlier para o painel e passar à declaração de não-preditibilidade para
  ELET6×resultado_bruto (e ELET6×despesas_operacionais, se também não melhorar aqui) como
  próximo e último passo antes de consolidar o painel de 12 combos como estado final da tese.
