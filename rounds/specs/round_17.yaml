next_round: >
  Se algum combo melhorar com BAYESARIMA (U₂<1, DM p<0.10), promovê-lo e registrar o λ0
  vencedor e a ordem (p,q) — investigar se o padrão de shrinkage (λ0 pequeno = pouco encolhimento
  vs. λ0 grande = encolhimento forte) se correlaciona com o grau de sobreajuste que o ARIMA MLE
  já mostrava naquele combo (ordem alta, MIN_TRAIN=20 apertado). Se nenhum combo melhorar, a
  regularização bayesiana pontual (MAP) está esgotada como frente de "modelo estatístico
  adicional" para este painel — junto com o veredito nulo do Round 16 (combinação), isso fecha
  a busca de modelo univariado/estrutural/não-linear/bayesiano-pontual sobre os campeões atuais;
  a próxima frente deixa de ser busca de modelo e passa a ser declaração formal de
  não-preditibilidade para os combos persistentemente fracos (ELET6×resultado_bruto,
  ELET6×despesas_operacionais) e aceitação documentada dos campeões atuais como estado final do
  painel para os demais combos.
