next_round: >
  Round 24 — se alguma combinação passar a ter boxcox como campeão sob U₂<1 e DM-p<0.10, registrar
  o λ de Guerrero usado em protocolo metodológico §25 (tabela de campeões) e avaliar se vale estender a
  implementação de boxcox_lambda às famílias Wiener/Hammerstein/HW (fora de escopo neste round).
  Se nenhuma combinação melhorar, encerrar a frente de "estabilização de variância via
  pré-processamento" para o painel e retomar a declaração de não-preditibilidade para
  ELET6×resultado_bruto (e ELET6×despesas_operacionais, se também não melhorar aqui) como próximo
  passo antes de consolidar o painel de 12 combos.
