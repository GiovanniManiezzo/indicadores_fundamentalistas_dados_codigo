next_round: >
  Se nenhum dos 8 combos melhorar com ETS/Theta, a varredura univariada parcimoniosa
  (linear, não-linear de bloco, suavização exponencial, Theta) está esgotada para todo o
  painel. Próxima frente: (a) declarar formalmente ELET6×resultado_bruto e
  ELET6×despesas_operacionais como não-preditíveis (protocolo metodológico, critério de
  não-preditibilidade); (b) avaliar combinação simples de forecasts (média dos 3-5 melhores
  candidatos por combo, Petropoulos et al. 2022 §2.6) para os combos com FIT% marginal ou
  modelos discordantes entre si; (c) TAEE4×resultado_bruto permanece em aberto no gate U₂ —
  via wrapper de state-space com damped trend dedicado (Gardner & McKenzie 1985), que exige
  novo modelo (procedure new-model), não mais um round sobre modelos existentes.
