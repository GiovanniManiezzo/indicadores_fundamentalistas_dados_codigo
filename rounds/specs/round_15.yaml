# Round 15 — extend DAMPEDTREND (Gardner & McKenzie 1985) to the remaining 11 combos.
round: 15
hypothesis: >
  O Round 14 introduziu `DampedTrendWrapper` (tendência linear local amortecida, forma
  estrutural MSOE, Harvey 1989 + Gardner & McKenzie 1985) motivado especificamente pela
  prioridade de gate U₂ aberta desde o Round 08 em TAEE4×resultado_bruto: o modelo superou o
  candidato SS não-amortecido em FIT% e U₂ (52.0% / 1.027 vs. 51.3% / 1.041) mas continuou
  falhando o gate estrito U₂<1, e o DM vs. ARIMA não foi significativo (p=0.144) — hipótese
  falsificada para aquele combo específico, campeão permanece ARIMA (diff, 44.0%/0.931).
  DAMPEDTREND já está registrado em `cfg.MODELOS`, então qualquer sweep `models: full` já o
  inclui como candidato — mas os outros 11 combos do painel nunca tiveram a chance de testá-lo,
  porque seus resultados só foram copiados adiante de baselines anteriores. Mesmo padrão do
  Round 13 (que estendeu ETS/Theta dos 4 combos do Round 12 para os outros 8). Não há razão a
  priori para restringir DAMPEDTREND a TAEE4×resultado_bruto: é um benchmark estrutural
  parcimonioso (4 parâmetros MLE, mesma ordem de grandeza de ETS/SS) e a amostra é pequena
  (N=64) o suficiente para que Petropoulos et al. (2022, §2.3.1/§2.3.4) recomendem testar toda a
  família de suavização/estrutural em qualquer combo do painel, não apenas nos mais fracos.
  Hipótese testável: em pelo menos um dos 11 combos, DAMPEDTREND bate o campeão atual em FIT%
  mantendo U₂<1, com significância DM vs. ARIMA (p<0.10). Condição de falsificação: um
  resultado nulo em todos os 11 reforça que a família de tendência amortecida estrutural
  (MSOE — este round — e SSOE — ETS(A,Ad,N), Round 12/13) está esgotada para o painel inteiro,
  não apenas para TAEE4×resultado_bruto, encerrando de vez a linha de investigação "modelo de
  tendência" aberta desde o Round 08.
justification: "protocolo metodológico §20 (DampedTrend); §18 (ETS/Gardner & McKenzie 1985); Gardner, E.S. & McKenzie, E. (1985), Management Science, 31(10), 1237-1246; Harvey, A.C. (1989), Forecasting, Structural Time Series Models and the Kalman Filter; Petropoulos, F. et al. (2022), IJF, 38(3), 705-871"
