next_round: >
  Se algum dos 11 combos melhorar com DAMPEDTREND (U₂<1, DM p<0.10), promovê-lo e investigar se
  o mesmo mecanismo de amortecimento generaliza para os combos vizinhos da mesma empresa. Se
  nenhum melhorar, a família de tendência amortecida estrutural (MSOE e SSOE) está esgotada para
  todo o painel — próxima frente passa a ser combinação simples de forecasts (Petropoulos et al.
  2022, §2.6) para os combos com FIT% marginal ou modelos discordantes, e declaração formal de
  não-preditibilidade para ELET6×resultado_bruto/despesas_operacionais.
