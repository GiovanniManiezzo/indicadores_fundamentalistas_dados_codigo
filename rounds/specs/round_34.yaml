# Round 34 — Era 31, reprodução de HAMMERSTEIN (Rounds 18, 27 e 30) nas 6 combinações.
# Último de quatro (31-34); protocolo metodológico §27, "Era 31".
round: 34
hypothesis: >
  Reinstaura na era 31 a família HAMMERSTEIN, que não entra em `models: full` e que a era anterior
  cobriu nos Rounds 18, 27 e 30. A família roda sem exógena (`exog: none`), de modo que a correção do
  funil não a alcança: o round existe porque a subida de TREATMENT_ERA para 31 tornou inelegíveis
  também os resultados sem exógena das seis combinações, e porque a eleição de campeão só é
  simétrica entre eras se o espaço explorado for o mesmo (protocolo metodológico §27). Para três das seis
  (ELET6×lucro_consolidado, ELET6×despesas_operacionais, ISAE4×resultado_bruto, em era 21 desde o
  Round 21) a família nunca rodou na era vigente — os Rounds 18/19 são anteriores à era 21 e os
  Rounds 26-30 cobriram só TAEE4/ALUP4 —, então o round também fecha essa lacuna de cobertura,
  sem previsão numérica para elas. Previsão pré-registrada para as outras três, cuja série não
  mudou desde a última execução da família: reprodução exata de ALUP4×resultado_bruto HAMMER-H3-BSpline3 38.4/0.970 e ALUP4×despesas_operacionais HAMMER-H2-Piecewise -4.8/0.805 (Round 30, era 28); TAEE4×despesas_operacionais HAMMER-H1-Sigmoid -13.0/1.284 (Round 18, era 8). Condição de falsificação:
  divergência em qualquer dessas três indica mudança além da era — o round é investigado antes de
  seguir. Um resultado HAMMERSTEIN só vira campeão se passar U₂ < 1 e superar o melhor da era 31.
justification: >
  protocolo metodológico §14-16 (modelos block-oriented e ALS) e §27 (Era 31); Narendra, K.S. & Gallman, P.G. (1966), IEEE Trans. Autom. Control 11(3), 546-550; Billings, S.A. (1980), International Journal of Control 31(6), 1013-1037; Ljung, L. (1999), System Identification, 2nd ed.
